<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Sheet — Content Studio</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; background: #1a1612; }
* { box-sizing: border-box; }
button { font: inherit; }
textarea, input { font: inherit; }
textarea::placeholder, input::placeholder { color: rgba(242,237,228,0.3); }

@keyframes studio-spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: rgba(242,237,228,0.04); }
::-webkit-scrollbar-thumb { background: rgba(242,237,228,0.15); }

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ---------- Constants ----------
const CHANNELS = {
  instagram: {
    key: "instagram",
    label: "Instagram",
    short: "IG",
    color: "#ff2d8e",
    dim: "rgba(255,45,142,0.12)",
    desc: "Fast, visual, of-the-moment",
  },
  patreon: {
    key: "patreon",
    label: "Patreon",
    short: "PAT",
    color: "#c8432a",
    dim: "rgba(200,67,42,0.14)",
    desc: "Behind-the-scenes, process, intimacy",
  },
  substack: {
    key: "substack",
    label: "Substack",
    short: "SUB",
    color: "#8a9a7e",
    dim: "rgba(138,154,126,0.16)",
    desc: "Slow, written, considered",
  },
};

const STAGE_LABEL = { frame: "Negative", draft: "Proof", ready: "Print" };
const STORAGE_KEY = "studio-ideas-v1";
const VISION_KEY = "studio-visions-v1";
const PAPER = "#f2ede4";
const INK = "#1a1612";
const SERIF = "'Fraunces', Georgia, serif";
const MONO = "'Space Mono', 'Courier New', monospace";

// ---------- Claude API helper ----------
async function callClaude(messages, system, maxTokens = 1200) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens,
      system,
      messages,
    }),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    const short = errText ? ": " + errText.slice(0, 80) : "";
    throw new Error("API error " + res.status + short);
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (!text.trim()) throw new Error("Empty response from model");
  return text;
}

function extractJSON(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json\s*/i, "").replace(/^```\s*/, "").replace(/```\s*$/, "");
  const candidates = [t.indexOf("["), t.indexOf("{")].filter((i) => i >= 0);
  const start = candidates.length ? Math.min(...candidates) : -1;
  const lastArr = t.lastIndexOf("]");
  const lastObj = t.lastIndexOf("}");
  const end = Math.max(lastArr, lastObj);
  if (start >= 0 && end >= 0) t = t.slice(start, end + 1);
  const parsed = JSON.parse(t);
  return Array.isArray(parsed) ? parsed : [parsed];
}

function safeChannel(ch) {
  return CHANNELS[ch] ? ch : "instagram";
}

// ---------- Storage helpers (defensive: window.storage may not exist) ----------
const hasStorage = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadIdeas() {
  if (!hasStorage) return [];
  try {
    const r = await window.storage.get(STORAGE_KEY);
    return r ? JSON.parse(r.value) : [];
  } catch (e) {
    return [];
  }
}
async function saveIdeas(ideas) {
  if (!hasStorage) return;
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(ideas));
  } catch (e) {
    console.error("save failed", e);
  }
}
async function loadVisions() {
  const fallback = { instagram: "", patreon: "", substack: "" };
  if (!hasStorage) return fallback;
  try {
    const r = await window.storage.get(VISION_KEY);
    return r ? { ...fallback, ...JSON.parse(r.value) } : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveVisions(v) {
  if (!hasStorage) return;
  try {
    await window.storage.set(VISION_KEY, JSON.stringify(v));
  } catch (e) {
    console.error("save failed", e);
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ---------- Small UI atoms ----------
function Spinner({ color = "#ff2d8e", size = 14 }) {
  return (
    <span
      style={{
        display: "inline-block",
        width: size,
        height: size,
        borderRadius: "50%",
        border: `2px solid ${color}`,
        borderTopColor: "transparent",
        animation: "studio-spin 0.7s linear infinite",
        flexShrink: 0,
      }}
    />
  );
}

function ErrorNote({ message, onDismiss }) {
  if (!message) return null;
  return (
    <div
      style={{
        border: "1px solid rgba(200,67,42,0.5)",
        background: "rgba(200,67,42,0.1)",
        color: "#e8a08f",
        fontFamily: MONO,
        fontSize: 11,
        padding: "8px 10px",
        marginTop: 8,
        display: "flex",
        justifyContent: "space-between",
        alignItems: "flex-start",
        gap: 8,
        lineHeight: 1.5,
      }}
    >
      <span>{message}</span>
      {onDismiss && (
        <button
          onClick={onDismiss}
          style={{
            background: "none",
            border: "none",
            color: "#e8a08f",
            cursor: "pointer",
            fontFamily: MONO,
            fontSize: 11,
            padding: 0,
            flexShrink: 0,
          }}
        >
          ✕
        </button>
      )}
    </div>
  );
}

function ChannelPill({ channel, active, onClick }) {
  const c = CHANNELS[channel];
  return (
    <button
      onClick={onClick}
      style={{
        padding: "6px 12px",
        fontSize: 11,
        letterSpacing: "0.12em",
        textTransform: "uppercase",
        fontFamily: MONO,
        border: `1px solid ${active ? c.color : "rgba(242,237,228,0.18)"}`,
        background: active ? c.dim : "transparent",
        color: active ? c.color : "rgba(242,237,228,0.55)",
        cursor: "pointer",
        transition: "all 0.15s ease",
        whiteSpace: "nowrap",
      }}
    >
      {c.short} · {c.label}
    </button>
  );
}

const btnBase = {
  fontFamily: MONO,
  fontSize: 11,
  textTransform: "uppercase",
  letterSpacing: "0.08em",
  cursor: "pointer",
  display: "inline-flex",
  alignItems: "center",
  gap: 8,
  padding: "9px 14px",
  border: "1px solid transparent",
  transition: "opacity 0.15s ease",
};

function fieldStyle(extra) {
  return {
    width: "100%",
    background: "transparent",
    border: "1px solid rgba(242,237,228,0.15)",
    color: PAPER,
    padding: "10px 12px",
    fontSize: 13,
    lineHeight: 1.6,
    resize: "none",
    outline: "none",
    boxSizing: "border-box",
    ...extra,
  };
}

// ---------- Vision Room ----------
function VisionRoom({ visions, setVisions, onClose }) {
  const [local, setLocal] = useState(visions);
  const [busy, setBusy] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => setLocal(visions), [visions]);

  async function suggestVision(channelKey) {
    setBusy(channelKey);
    setError("");
    const c = CHANNELS[channelKey];
    try {
      const text = await callClaude(
        [
          {
            role: "user",
            content: `Kali is a London analogue photographer & experimental filmmaker (brand: "Queen of the Grain") working with 35mm, darkroom printing, film souping, expired stock. She also runs a creative ops consultancy. Write a short, punchy 3-4 sentence VISION + TONE statement for her ${c.label} channel specifically (${c.desc}). Make it concrete and specific to her actual practice, not generic creator advice. Write it as if it's notes-to-self she'd pin above her desk. No headers, no markdown, just the statement.`,
          },
        ],
        "You are a sharp creative strategist who writes vision statements in a direct, specific, slightly literary voice — never generic marketing-speak.",
        400
      );
      const updated = { ...local, [channelKey]: text.trim() };
      setLocal(updated);
      setVisions(updated);
      saveVisions(updated);
    } catch (e) {
      setError("Couldn't generate a suggestion (" + e.message + "). You can still write your own below.");
    }
    setBusy(null);
  }

  function update(channelKey, val) {
    setLocal((prev) => ({ ...prev, [channelKey]: val }));
  }

  function commit() {
    setVisions(local);
    saveVisions(local);
    onClose();
  }

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        zIndex: 50,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        background: "rgba(0,0,0,0.7)",
        backdropFilter: "blur(4px)",
        padding: 16,
      }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div
        style={{
          width: "100%",
          maxWidth: 640,
          maxHeight: "92vh",
          overflowY: "auto",
          background: INK,
          border: "1px solid rgba(242,237,228,0.15)",
        }}
      >
        <div
          style={{
            position: "sticky",
            top: 0,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,
            padding: "16px 20px",
            borderBottom: "1px solid rgba(242,237,228,0.12)",
            background: INK,
          }}
        >
          <div>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(242,237,228,0.4)" }}>
              Light Table
            </div>
            <h2 style={{ fontFamily: SERIF, fontSize: 20, color: PAPER, margin: "2px 0 0" }}>Vision &amp; tone, per channel</h2>
          </div>
          <button
            onClick={commit}
            style={{ ...btnBase, background: "#ff2d8e", color: INK, flexShrink: 0 }}
          >
            Save &amp; close
          </button>
        </div>

        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 20 }}>
          {Object.values(CHANNELS).map((c) => (
            <div key={c.key} style={{ border: "1px solid rgba(242,237,228,0.12)" }}>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  gap: 8,
                  padding: "10px 16px",
                  background: c.dim,
                  flexWrap: "wrap",
                }}
              >
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: MONO, fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: c.color }}>
                    {c.label}
                  </span>
                  <span style={{ fontSize: 11, color: "rgba(242,237,228,0.45)", fontFamily: MONO }}>{c.desc}</span>
                </div>
                <button
                  onClick={() => suggestVision(c.key)}
                  disabled={busy === c.key}
                  style={{
                    ...btnBase,
                    fontSize: 10,
                    padding: "5px 10px",
                    border: `1px solid ${c.color}`,
                    color: c.color,
                    background: "transparent",
                    opacity: busy === c.key ? 0.6 : 1,
                  }}
                >
                  {busy === c.key ? <Spinner color={c.color} size={11} /> : null}
                  {busy === c.key ? "writing" : "suggest"}
                </button>
              </div>
              <textarea
                value={local[c.key] || ""}
                onChange={(e) => update(c.key, e.target.value)}
                placeholder={`What is ${c.label} for? Tone, pace, what you won't post here...`}
                rows={4}
                style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: "12px 16px" })}
              />
            </div>
          ))}
          <ErrorNote message={error} onDismiss={() => setError("")} />
        </div>
      </div>
    </div>
  );
}

// ---------- Idea Frame (contact sheet cell) ----------
function IdeaFrame({ idea, onOpen, isActive }) {
  const c = CHANNELS[safeChannel(idea.channel)];
  const [hover, setHover] = useState(false);
  return (
    <button
      onClick={onOpen}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        position: "relative",
        flexShrink: 0,
        width: 150,
        height: 190,
        textAlign: "left",
        padding: "12px 12px 12px 18px",
        display: "flex",
        flexDirection: "column",
        justifyContent: "space-between",
        cursor: "pointer",
        transform: hover ? "translateY(-2px)" : "none",
        transition: "transform 0.15s ease",
        border: `1px solid ${isActive ? c.color : "rgba(242,237,228,0.18)"}`,
        background: isActive ? c.dim : "rgba(242,237,228,0.03)",
        fontFamily: "inherit",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: c.color }}>
          {c.short}
        </span>
        <span style={{ fontFamily: MONO, fontSize: 9, textTransform: "uppercase", color: "rgba(242,237,228,0.35)" }}>
          {STAGE_LABEL[idea.stage] || "Negative"}
        </span>
      </div>
      <div
        style={{
          fontFamily: SERIF,
          fontSize: 13,
          lineHeight: 1.35,
          color: PAPER,
          display: "-webkit-box",
          WebkitLineClamp: 5,
          WebkitBoxOrient: "vertical",
          overflow: "hidden",
        }}
      >
        {idea.title || idea.raw}
      </div>
      <div style={{ fontFamily: MONO, fontSize: 9, color: "rgba(242,237,228,0.3)" }}>
        #{String(idea.frameNo).padStart(3, "0")}
      </div>
      {/* sprocket holes */}
      <div
        style={{
          position: "absolute",
          left: -1,
          top: 0,
          bottom: 0,
          width: 6,
          display: "flex",
          flexDirection: "column",
          justifyContent: "space-evenly",
          padding: "8px 0",
        }}
      >
        {[0, 1, 2, 3].map((i) => (
          <div key={i} style={{ width: 4, height: 4, borderRadius: 1, background: INK }} />
        ))}
      </div>
    </button>
  );
}

// ---------- Detail panel ----------
function IdeaDetail({ idea, onUpdate, onDelete, onSpawnMore, visions }) {
  const [draftBusy, setDraftBusy] = useState(false);
  const [trendBusy, setTrendBusy] = useState(false);
  const [moreBusy, setMoreBusy] = useState(false);
  const [editingDraft, setEditingDraft] = useState(idea.draft || "");
  const [elaborateNote, setElaborateNote] = useState("");
  const [elaborateBusy, setElaborateBusy] = useState(false);
  const [error, setError] = useState("");
  const c = CHANNELS[safeChannel(idea.channel)];

  useEffect(() => {
    setEditingDraft(idea.draft || "");
    setError("");
  }, [idea.id]);

  function patch(fields) {
    onUpdate({ ...idea, ...fields });
  }

  async function generateDraft() {
    setDraftBusy(true);
    setError("");
    try {
      const sys = `You write Instagram captions, Patreon posts, and Substack newsletter copy for Kali, a London analogue photographer and experimental filmmaker (brand "Queen of the Grain") working in 35mm, darkroom printing, film souping, expired stock. Match the channel's tone exactly. Write in her voice: direct, sensory, unpretentious, no hashtag spam, no generic creator-speak ("level up your", "game-changer", emoji walls). Output ONLY the post content, nothing else — no preamble, no "Here's a draft".`;
      const visionNote = visions[idea.channel] ? `\n\nChannel vision/tone notes: ${visions[idea.channel]}` : "";
      const userMsg = `Channel: ${c.label} (${c.desc})${visionNote}\n\nIdea: ${idea.raw}${idea.title ? `\nWorking title: ${idea.title}` : ""}\n\nWrite a ready-to-edit ${c.label} post draft from this idea.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim(), stage: "draft" });
    } catch (e) {
      setError("Draft failed: " + e.message);
    }
    setDraftBusy(false);
  }

  async function elaborate() {
    if (!elaborateNote.trim()) return;
    setElaborateBusy(true);
    setError("");
    try {
      const sys = `You write/edit social and newsletter content for Kali (Queen of the Grain — analogue photography, darkroom, film souping). Keep her voice: direct, sensory, no creator-speak. Output ONLY the revised post, nothing else.`;
      const userMsg = `Channel: ${c.label}\n\nCurrent draft:\n${editingDraft}\n\nRevision request: ${elaborateNote}\n\nReturn the full revised draft.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim() });
      setElaborateNote("");
    } catch (e) {
      setError("Edit failed: " + e.message);
    }
    setElaborateBusy(false);
  }

  async function checkTrends() {
    setTrendBusy(true);
    setError("");
    try {
      const sys = `You are a content strategist. Give brief, concrete, non-generic notes on current demand/format trends relevant to the given idea and channel, for an analogue film photographer audience. 3 bullet points max, each one sentence, no fluff, no hashtags. Note: base this on general patterns you know of, since you don't have live search access here — keep claims general rather than citing specific recent events.`;
      const userMsg = `Channel: ${c.label}\nIdea: ${idea.raw}\n\nWhat's currently working in this content space (formats, hooks, angles) that this idea could borrow from?`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 500);
      patch({ trendNotes: text.trim() });
    } catch (e) {
      setError("Couldn't fetch notes: " + e.message);
    }
    setTrendBusy(false);
  }

  async function spawnMore() {
    setMoreBusy(true);
    setError("");
    try {
      const sys = `You generate content ideas for Kali, a London analogue photographer/filmmaker (Queen of the Grain: 35mm, darkroom, film souping, expired stock, also building a creative-ops consultancy). Respond with ONLY a JSON array of exactly 3 objects: [{"title": "...", "raw": "...", "channel": "instagram"|"patreon"|"substack"}]. "title" is a punchy 5-8 word title. "raw" is 1-2 sentences fleshing out the idea. Pick whichever channel fits each idea best — don't force all 3 onto the same one. No markdown, no commentary, just the JSON array.`;
      const userMsg = `Seed idea (on ${c.label}): "${idea.raw}"${idea.draft ? `\n\nDraft that came from it:\n${idea.draft}` : ""}\n\nGive me 3 adjacent or follow-on content ideas — different enough to not be repeats, but clearly related in spirit or process.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 700);
      const arr = extractJSON(text);
      if (!arr.length) throw new Error("model returned no ideas");
      onSpawnMore(arr);
    } catch (e) {
      setError("Couldn't generate follow-ons: " + e.message);
    }
    setMoreBusy(false);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 8,
          padding: "14px 20px",
          borderBottom: "1px solid rgba(242,237,228,0.12)",
          flexWrap: "wrap",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          {Object.values(CHANNELS).map((ch) => (
            <button
              key={ch.key}
              onClick={() => patch({ channel: ch.key })}
              style={{
                padding: "4px 8px",
                fontSize: 10,
                fontFamily: MONO,
                textTransform: "uppercase",
                letterSpacing: "0.08em",
                cursor: "pointer",
                border: `1px solid ${idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.15)"}`,
                color: idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.4)",
                background: idea.channel === ch.key ? ch.dim : "transparent",
              }}
            >
              {ch.short}
            </button>
          ))}
        </div>
        <button
          onClick={() => onDelete(idea.id)}
          style={{
            fontSize: 10,
            fontFamily: MONO,
            textTransform: "uppercase",
            letterSpacing: "0.08em",
            color: "rgba(242,237,228,0.35)",
            background: "none",
            border: "none",
            cursor: "pointer",
          }}
        >
          delete
        </button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 20 }}>
        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
            Title
          </label>
          <input
            value={idea.title}
            onChange={(e) => patch({ title: e.target.value })}
            placeholder="Untitled frame"
            style={{
              width: "100%",
              background: "transparent",
              border: "none",
              borderBottom: "1px solid rgba(242,237,228,0.2)",
              padding: "4px 0",
              fontSize: 16,
              fontFamily: SERIF,
              color: PAPER,
              outline: "none",
              boxSizing: "border-box",
            }}
          />
        </div>

        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
            The idea, raw
          </label>
          <textarea
            value={idea.raw}
            onChange={(e) => patch({ raw: e.target.value })}
            rows={3}
            style={fieldStyle({ color: "rgba(242,237,228,0.85)" })}
          />
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <button
            onClick={generateDraft}
            disabled={draftBusy}
            style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: draftBusy ? 0.6 : 1 }}
          >
            {draftBusy && <Spinner color={INK} size={12} />}
            {idea.draft ? "Re-draft" : "Draft this"}
          </button>
          <button
            onClick={checkTrends}
            disabled={trendBusy}
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent", opacity: trendBusy ? 0.6 : 1 }}
          >
            {trendBusy && <Spinner color={PAPER} size={12} />}
            What's working now
          </button>
        </div>

        <ErrorNote message={error} onDismiss={() => setError("")} />

        {idea.trendNotes && (
          <div
            style={{
              borderLeft: `2px solid ${c.color}`,
              paddingLeft: 12,
              fontSize: 12,
              lineHeight: 1.6,
              whiteSpace: "pre-line",
              color: "rgba(242,237,228,0.7)",
            }}
          >
            {idea.trendNotes}
          </div>
        )}

        {(idea.draft || draftBusy) && (
          <div>
            <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
              Draft — edit freely
            </label>
            {draftBusy && !editingDraft ? (
              <div
                style={{
                  ...fieldStyle({ fontFamily: SERIF, fontSize: 14 }),
                  minHeight: 160,
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  color: "rgba(242,237,228,0.4)",
                }}
              >
                <Spinner color={c.color} size={12} /> developing print...
              </div>
            ) : (
              <textarea
                value={editingDraft}
                onChange={(e) => {
                  setEditingDraft(e.target.value);
                  patch({ draft: e.target.value });
                }}
                rows={10}
                style={fieldStyle({ fontFamily: SERIF, fontSize: 14, padding: "12px" })}
              />
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <input
                value={elaborateNote}
                onChange={(e) => setElaborateNote(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && elaborate()}
                placeholder="Tell Claude how to change it — shorter, warmer, add a CTA..."
                style={{
                  flex: 1,
                  minWidth: 160,
                  background: "transparent",
                  border: "1px solid rgba(242,237,228,0.15)",
                  color: PAPER,
                  padding: "8px 10px",
                  fontSize: 12,
                  outline: "none",
                  boxSizing: "border-box",
                  fontFamily: "inherit",
                }}
              />
              <button
                onClick={elaborate}
                disabled={elaborateBusy || !elaborateNote.trim()}
                style={{
                  ...btnBase,
                  border: `1px solid ${c.color}`,
                  color: c.color,
                  background: "transparent",
                  opacity: elaborateBusy || !elaborateNote.trim() ? 0.4 : 1,
                }}
              >
                {elaborateBusy ? <Spinner color={c.color} size={12} /> : "Elaborate"}
              </button>
            </div>
          </div>
        )}

        {idea.draft && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, paddingTop: 8, flexWrap: "wrap" }}>
            <button
              onClick={() => patch({ stage: idea.stage === "ready" ? "draft" : "ready" })}
              style={{
                ...btnBase,
                border: `1px solid ${idea.stage === "ready" ? "#8a9a7e" : "rgba(242,237,228,0.25)"}`,
                color: idea.stage === "ready" ? "#8a9a7e" : PAPER,
                background: "transparent",
              }}
            >
              {idea.stage === "ready" ? "✓ Marked ready to post" : "Mark ready to post"}
            </button>
            <button
              onClick={spawnMore}
              disabled={moreBusy}
              style={{
                ...btnBase,
                border: `1px solid ${c.color}`,
                color: c.color,
                background: "transparent",
                opacity: moreBusy ? 0.6 : 1,
              }}
            >
              {moreBusy && <Spinner color={c.color} size={12} />}
              + 3 more like this
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Brain Dump ----------
function BrainDump({ onAdd }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  async function process() {
    if (!text.trim()) return;
    setBusy(true);
    setError("");
    try {
      const sys = `You take messy, rapid-fire brain-dump text from Kali, an ADHD creative (analogue photographer/filmmaker, "Queen of the Grain" — 35mm, darkroom, film souping, expired stock; also runs a creative-ops consultancy). Split her dump into distinct content ideas — she often has several tangled together. For each, respond with ONLY a JSON array: [{"title": "5-8 word punchy title", "raw": "1-2 sentence clean version of the idea", "channel": "instagram"|"patreon"|"substack"}]. Pick the best-fit channel per idea: Instagram = fast/visual, Patreon = behind-the-scenes/process, Substack = slow/written/considered. If the dump is really just one idea, return an array with 1 item, not 3 padded ones. No markdown, no commentary.`;
      const out = await callClaude([{ role: "user", content: text }], sys, 800);
      const arr = extractJSON(out);
      if (!arr.length) throw new Error("couldn't find any ideas in that — try rephrasing");
      onAdd(arr);
      setText("");
    } catch (e) {
      setError("Couldn't process that: " + e.message);
    }
    setBusy(false);
  }

  return (
    <div style={{ border: "1px solid rgba(255,45,142,0.3)", background: "rgba(255,45,142,0.04)", padding: 16 }}>
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 8, color: "#ff2d8e" }}>
        Brain dump → frames
      </div>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Dump everything. Half-thoughts, three ideas tangled together, a feeling about a roll of film you just developed — whatever's loud right now. Claude will split it into separate frames and sort them onto the right channel."
        rows={4}
        style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: 0, marginBottom: 12 })}
      />
      <button
        onClick={process}
        disabled={busy || !text.trim()}
        style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: busy || !text.trim() ? 0.5 : 1, padding: "10px 16px" }}
      >
        {busy && <Spinner color={INK} size={12} />}
        {busy ? "Developing..." : "Develop into frames"}
      </button>
      <ErrorNote message={error} onDismiss={() => setError("")} />
    </div>
  );
}

// ---------- Main App ----------
function App() {
  const [ideas, setIdeas] = useState([]);
  const [visions, setVisions] = useState({ instagram: "", patreon: "", substack: "" });
  const [filter, setFilter] = useState("all");
  const [activeId, setActiveId] = useState(null);
  const [showVision, setShowVision] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [isNarrow, setIsNarrow] = useState(typeof window !== "undefined" ? window.innerWidth < 1024 : false);

  useEffect(() => {
    (async () => {
      const [i, v] = await Promise.all([loadIdeas(), loadVisions()]);
      setIdeas(i);
      setVisions(v);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    function onResize() {
      setIsNarrow(window.innerWidth < 1024);
    }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  function nextFrameNo(list) {
    return list.length ? Math.max(...list.map((i) => i.frameNo)) + 1 : 1;
  }

  function addIdeasFromArray(arr) {
    setIdeas((prev) => {
      let n = nextFrameNo(prev);
      const fresh = arr.map((a) => ({
        id: uid(),
        title: a.title || "",
        raw: a.raw || a.title || "",
        channel: safeChannel(a.channel),
        stage: "frame",
        draft: "",
        trendNotes: "",
        frameNo: n++,
        createdAt: Date.now(),
      }));
      const next = [...fresh, ...prev];
      saveIdeas(next);
      if (fresh.length) setActiveId(fresh[0].id);
      return next;
    });
  }

  function updateIdea(updated) {
    setIdeas((prev) => {
      const next = prev.map((i) => (i.id === updated.id ? updated : i));
      saveIdeas(next);
      return next;
    });
  }

  function deleteIdea(id) {
    setIdeas((prev) => {
      const next = prev.filter((i) => i.id !== id);
      saveIdeas(next);
      return next;
    });
    setActiveId((curr) => (curr === id ? null : curr));
  }

  const filtered = ideas.filter((i) => filter === "all" || i.channel === filter);
  const active = ideas.find((i) => i.id === activeId);

  const counts = ideas.reduce((acc, i) => {
    const k = safeChannel(i.channel);
    acc[k] = (acc[k] || 0) + 1;
    return acc;
  }, {});

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column", background: INK, color: PAPER, fontFamily: MONO }}>
      <header
        style={{
          borderBottom: "1px solid rgba(242,237,228,0.12)",
          padding: "16px 20px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 12,
          flexWrap: "wrap",
        }}
      >
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <h1 style={{ fontFamily: SERIF, fontWeight: 500, fontSize: 24, margin: 0, letterSpacing: "-0.01em" }}>
            Contact Sheet
          </h1>
          <span style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(242,237,228,0.4)" }}>
            content studio
          </span>
        </div>
        <button
          onClick={() => setShowVision(true)}
          style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}
        >
          Vision &amp; tone
        </button>
      </header>

      <div style={{ flex: 1, display: "flex", flexDirection: isNarrow ? "column" : "row", minHeight: 0 }}>
        <div
          style={{
            flex: 1,
            display: "flex",
            flexDirection: "column",
            minHeight: 0,
            borderRight: isNarrow ? "none" : "1px solid rgba(242,237,228,0.12)",
            borderBottom: isNarrow ? "1px solid rgba(242,237,228,0.12)" : "none",
          }}
        >
          <div style={{ padding: 20 }}>
            <BrainDump onAdd={addIdeasFromArray} />
          </div>

          <div style={{ padding: "0 20px 8px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <button
              onClick={() => setFilter("all")}
              style={{
                padding: "6px 12px",
                fontSize: 11,
                letterSpacing: "0.12em",
                textTransform: "uppercase",
                fontFamily: MONO,
                border: `1px solid ${filter === "all" ? PAPER : "rgba(242,237,228,0.18)"}`,
                color: filter === "all" ? PAPER : "rgba(242,237,228,0.55)",
                background: "transparent",
                cursor: "pointer",
              }}
            >
              ALL · {ideas.length}
            </button>
            {Object.keys(CHANNELS).map((k) => (
              <ChannelPill key={k} channel={k} active={filter === k} onClick={() => setFilter(k)} />
            ))}
            <span style={{ fontFamily: MONO, fontSize: 10, color: "rgba(242,237,228,0.35)", marginLeft: "auto" }}>
              {Object.entries(counts)
                .map(([k, v]) => `${CHANNELS[k].short} ${v}`)
                .join("  ·  ")}
            </span>
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 20px" }}>
            {!loaded ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "40px 0", textAlign: "center", color: "rgba(242,237,228,0.4)" }}>
                loading sheet...
              </div>
            ) : filtered.length === 0 ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "64px 0", textAlign: "center", lineHeight: 1.6, color: "rgba(242,237,228,0.35)" }}>
                No frames yet.
                <br />
                Dump a thought above — it'll show up here.
              </div>
            ) : (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
                {filtered.map((idea) => (
                  <IdeaFrame key={idea.id} idea={idea} isActive={idea.id === activeId} onOpen={() => setActiveId(idea.id)} />
                ))}
              </div>
            )}
          </div>
        </div>

        <div
          style={{
            width: isNarrow ? "100%" : 480,
            flexShrink: 0,
            display: "flex",
            flexDirection: "column",
            minHeight: isNarrow ? 400 : 0,
            background: "rgba(242,237,228,0.02)",
          }}
        >
          {active ? (
            <IdeaDetail
              key={active.id}
              idea={active}
              visions={visions}
              onUpdate={updateIdea}
              onDelete={deleteIdea}
              onSpawnMore={addIdeasFromArray}
            />
          ) : (
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 32, textAlign: "center" }}>
              <div style={{ fontFamily: MONO, fontSize: 12, lineHeight: 1.6, color: "rgba(242,237,228,0.35)" }}>
                Select a frame to develop it
                <br />
                into a draft, or dump a new
                <br />
                idea on the left.
              </div>
            </div>
          )}
        </div>
      </div>

      {showVision && <VisionRoom visions={visions} setVisions={setVisions} onClose={() => setShowVision(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
