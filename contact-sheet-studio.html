<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Sheet — Content Studio</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; background: #1a1612; }
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
textarea, input { font: inherit; }
textarea::placeholder, input::placeholder { color: rgba(242,237,228,0.3); }

@keyframes studio-spin { to { transform: rotate(360deg); } }
@keyframes pulse-save { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: rgba(242,237,228,0.04); }
::-webkit-scrollbar-thumb { background: rgba(242,237,228,0.15); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(242,237,228,0.25); }

.save-indicator { animation: pulse-save 1.2s ease-in-out; font-size: 10px; color: rgba(138,154,126,0.8); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Constants
const CHANNELS = {
  instagram: { key: "instagram", label: "Instagram", short: "IG", color: "#ff2d8e", dim: "rgba(255,45,142,0.12)", desc: "Fast, visual, of-the-moment" },
  patreon: { key: "patreon", label: "Patreon", short: "PAT", color: "#c8432a", dim: "rgba(200,67,42,0.14)", desc: "Behind-the-scenes, process, intimacy" },
  substack: { key: "substack", label: "Substack", short: "SUB", color: "#8a9a7e", dim: "rgba(138,154,126,0.16)", desc: "Slow, written, considered" },
};

const STAGE_LABEL = { frame: "Negative", draft: "Proof", ready: "Print" };
const STORAGE_KEY = "studio-ideas-v1";
const VISION_KEY = "studio-visions-v1";
const ACTIVE_KEY = "studio-active-id-v1";
const API_KEY_KEY = "studio-api-key-v1";
const PAPER = "#f2ede4";
const INK = "#1a1612";
const SERIF = "'Fraunces', Georgia, serif";
const MONO = "'Space Mono', 'Courier New', monospace";

// Claude API Helper
async function callClaude(messages, system, maxTokens = 1200) {
  const apiKey = typeof window !== "undefined" && window.localStorage ? window.localStorage.getItem(API_KEY_KEY) : null;
  if (!apiKey) throw new Error("API key not configured. Click ⚙ to add your Claude API key.");
  
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01" },
    body: JSON.stringify({ model: "claude-3-5-sonnet-20241022", max_tokens: maxTokens, system, messages }),
  });
  if (!res.ok) {
    let msg = "API error " + res.status;
    if (res.status === 401) msg = "Invalid API key.";
    else if (res.status === 429) msg = "Rate limited. Wait a moment.";
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  if (!text.trim()) throw new Error("Empty response from model");
  return text;
}

function extractJSON(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json\s*/i, "").replace(/^```\s*/, "").replace(/```\s*$/, "");
  const candidates = [t.indexOf("["), t.indexOf("{")].filter((i) => i >= 0);
  const start = candidates.length ? Math.min(...candidates) : -1;
  const end = Math.max(t.lastIndexOf("]"), t.lastIndexOf("}"));
  if (start >= 0 && end >= 0) t = t.slice(start, end + 1);
  const parsed = JSON.parse(t);
  return Array.isArray(parsed) ? parsed : [parsed];
}

function safeChannel(ch) { return CHANNELS[ch] ? ch : "instagram"; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// Storage
async function loadIdeas() {
  if (typeof localStorage === "undefined") return [];
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
}
async function saveIdeas(ideas) {
  if (typeof localStorage === "undefined") return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas)); } catch (e) {}
}
async function loadVisions() {
  const fallback = { instagram: "", patreon: "", substack: "" };
  if (typeof localStorage === "undefined") return fallback;
  try { return { ...fallback, ...JSON.parse(localStorage.getItem(VISION_KEY) || "{}") }; } catch (e) { return fallback; }
}
async function saveVisions(v) {
  if (typeof localStorage === "undefined") return;
  try { localStorage.setItem(VISION_KEY, JSON.stringify(v)); } catch (e) {}
}

// UI Components
function Spinner({ color = "#ff2d8e", size = 14 }) {
  return <span style={{ display: "inline-block", width: size, height: size, borderRadius: "50%", border: `2px solid ${color}`, borderTopColor: "transparent", animation: "studio-spin 0.7s linear infinite", flexShrink: 0 }} />;
}

function SaveIndicator() {
  return <span className="save-indicator">✓ saved</span>;
}

function ErrorNote({ message, onDismiss }) {
  if (!message) return null;
  return (
    <div style={{ border: "1px solid rgba(200,67,42,0.5)", background: "rgba(200,67,42,0.1)", color: "#e8a08f", fontFamily: MONO, fontSize: 11, padding: "8px 10px", marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, lineHeight: 1.5 }}>
      <span>{message}</span>
      {onDismiss && <button onClick={onDismiss} style={{ background: "none", border: "none", color: "#e8a08f", cursor: "pointer", fontFamily: MONO, fontSize: 11, padding: 0, flexShrink: 0 }}>✕</button>}
    </div>
  );
}

function ChannelPill({ channel, active, onClick }) {
  const c = CHANNELS[channel];
  return (
    <button onClick={onClick} style={{ padding: "6px 12px", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", fontFamily: MONO, border: `1px solid ${active ? c.color : "rgba(242,237,228,0.18)"}`, background: active ? c.dim : "transparent", color: active ? c.color : "rgba(242,237,228,0.55)", cursor: "pointer", transition: "all 0.15s ease", whiteSpace: "nowrap" }}>
      {c.short} · {c.label}
    </button>
  );
}

const btnBase = { fontFamily: MONO, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 8, padding: "9px 14px", border: "1px solid transparent", transition: "opacity 0.15s ease" };

function fieldStyle(extra) {
  return { width: "100%", background: "transparent", border: "1px solid rgba(242,237,228,0.15)", color: PAPER, padding: "10px 12px", fontSize: 13, lineHeight: 1.6, resize: "none", outline: "none", boxSizing: "border-box", ...extra };
}

// API Key Modal
function ApiKeyModal({ onClose, onSet }) {
  const [key, setKey] = useState("");
  const [masked, setMasked] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  useEffect(() => {
    if (typeof localStorage !== "undefined") {
      const stored = localStorage.getItem(API_KEY_KEY);
      if (stored) { setMasked(stored.slice(0, 10) + "..." + stored.slice(-4)); setSuccess(true); }
    }
  }, []);

  function handleSet() {
    if (!key.trim()) { setError("Please enter an API key"); return; }
    if (key.length < 20) { setError("API key seems too short"); return; }
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(API_KEY_KEY, key);
      setKey("");
      setMasked(key.slice(0, 10) + "..." + key.slice(-4));
      setError("");
      setSuccess(true);
      onSet();
      setTimeout(() => onClose(), 1000);
    }
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.8)", backdropFilter: "blur(4px)", padding: 16 }} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ width: "100%", maxWidth: 500, background: INK, border: "1px solid rgba(242,237,228,0.15)", padding: 24 }}>
        <h2 style={{ fontFamily: SERIF, fontSize: 18, color: PAPER, margin: "0 0 12px" }}>Claude API Key</h2>
        <p style={{ fontFamily: MONO, fontSize: 11, color: "rgba(242,237,228,0.6)", marginBottom: 12, lineHeight: 1.6 }}>
          Get your key from <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener noreferrer" style={{ color: "#ff2d8e", textDecoration: "none" }}>console.anthropic.com</a>. Your key is stored locally only.
        </p>
        {success && <div style={{ background: "rgba(138,154,126,0.1)", border: "1px solid rgba(138,154,126,0.3)", color: "#8a9a7e", fontFamily: MONO, fontSize: 11, padding: "8px 10px", marginBottom: 12 }}>✓ Configured: {masked}</div>}
        {!success && <input type="password" value={key} onChange={(e) => { setKey(e.target.value); setError(""); }} onKeyDown={(e) => e.key === "Enter" && handleSet()} placeholder="sk-ant-..." style={{ ...fieldStyle({}), marginBottom: 12, fontFamily: MONO, fontSize: 12 }} autoFocus />}
        {error && <ErrorNote message={error} onDismiss={() => setError("")} />}
        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button onClick={onClose} style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}>Close</button>
          {!success && <button onClick={handleSet} style={{ ...btnBase, background: "#ff2d8e", color: INK }}>Save Key</button>}
        </div>
      </div>
    </div>
  );
}

// Vision Room
function VisionRoom({ visions, setVisions, onClose }) {
  const [local, setLocal] = useState(visions);
  const [busy, setBusy] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => setLocal(visions), [visions]);

  async function suggestVision(channelKey) {
    setBusy(channelKey);
    setError("");
    const c = CHANNELS[channelKey];
    try {
      const text = await callClaude([{ role: "user", content: `Kali is a London analogue photographer (Queen of the Grain). Write a 1-2 sentence vision statement for ${c.label}: ${c.desc}` }], "You write sharp, specific vision statements. No marketing speak.", 300);
      const updated = { ...local, [channelKey]: text.trim() };
      setLocal(updated);
      setVisions(updated);
      saveVisions(updated);
    } catch (e) {
      setError(e.message);
    }
    setBusy(null);
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.7)", backdropFilter: "blur(4px)", padding: 16 }} onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ width: "100%", maxWidth: 640, maxHeight: "92vh", overflowY: "auto", background: INK, border: "1px solid rgba(242,237,228,0.15)" }}>
        <div style={{ position: "sticky", top: 0, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "16px 20px", borderBottom: "1px solid rgba(242,237,228,0.12)", background: INK }}>
          <div><div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(242,237,228,0.4)" }}>Light Table</div><h2 style={{ fontFamily: SERIF, fontSize: 20, color: PAPER, margin: "2px 0 0" }}>Vision &amp; tone</h2></div>
          <button onClick={() => { setVisions(local); saveVisions(local); onClose(); }} style={{ ...btnBase, background: "#ff2d8e", color: INK, flexShrink: 0 }}>Done</button>
        </div>
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 20 }}>
          {Object.values(CHANNELS).map((c) => (
            <div key={c.key} style={{ border: "1px solid rgba(242,237,228,0.12)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "10px 16px", background: c.dim, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: MONO, fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: c.color }}>{c.label}</span>
                  <span style={{ fontSize: 11, color: "rgba(242,237,228,0.45)", fontFamily: MONO }}>{c.desc}</span>
                </div>
                <button onClick={() => suggestVision(c.key)} disabled={busy === c.key} style={{ ...btnBase, fontSize: 10, padding: "5px 10px", border: `1px solid ${c.color}`, color: c.color, background: "transparent", opacity: busy === c.key ? 0.6 : 1 }}>
                  {busy === c.key ? <Spinner color={c.color} size={11} /> : null}
                  {busy === c.key ? "writing" : "suggest"}
                </button>
              </div>
              <textarea value={local[c.key] || ""} onChange={(e) => setLocal((prev) => ({ ...prev, [c.key]: e.target.value }))} placeholder={`What is ${c.label} for?`} rows={3} style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: "12px 16px" })} />
            </div>
          ))}
          <ErrorNote message={error} onDismiss={() => setError("")} />
        </div>
      </div>
    </div>
  );
}

// Idea Frame
function IdeaFrame({ idea, onOpen, isActive }) {
  const c = CHANNELS[safeChannel(idea.channel)];
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onOpen} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ position: "relative", flexShrink: 0, width: 150, height: 190, textAlign: "left", padding: "12px 12px 12px 18px", display: "flex", flexDirection: "column", justifyContent: "space-between", cursor: "pointer", transform: hover ? "translateY(-2px)" : "none", transition: "transform 0.15s ease", border: `1px solid ${isActive ? c.color : "rgba(242,237,228,0.18)"}`, background: isActive ? c.dim : "rgba(242,237,228,0.03)", fontFamily: "inherit" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: c.color }}>{c.short}</span>
        <span style={{ fontFamily: MONO, fontSize: 9, textTransform: "uppercase", color: "rgba(242,237,228,0.35)" }}>{STAGE_LABEL[idea.stage] || "Negative"}</span>
      </div>
      <div style={{ fontFamily: SERIF, fontSize: 13, lineHeight: 1.35, color: PAPER, display: "-webkit-box", WebkitLineClamp: 5, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{idea.title || idea.raw}</div>
      <div style={{ fontFamily: MONO, fontSize: 9, color: "rgba(242,237,228,0.3)" }}>#{String(idea.frameNo).padStart(3, "0")}</div>
    </button>
  );
}

// Brain Dump
function BrainDump({ onAdd }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  async function process() {
    if (!text.trim()) return;
    setBusy(true);
    setError("");
    try {
      const out = await callClaude([{ role: "user", content: text }], "Split this brain dump into 2-5 distinct content ideas. Return JSON array: [{title, raw, channel}]", 800);
      const arr = extractJSON(out);
      if (!arr.length) throw new Error("No ideas found");
      onAdd(arr);
      setText("");
    } catch (e) {
      setError("Error: " + e.message);
    }
    setBusy(false);
  }

  return (
    <div style={{ border: "1px solid rgba(255,45,142,0.3)", background: "rgba(255,45,142,0.04)", padding: 16 }}>
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 8, color: "#ff2d8e" }}>Brain dump → frames</div>
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Dump everything. Ideas, half-thoughts, feelings..." rows={4} style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: 0, marginBottom: 12 })} />
      <button onClick={process} disabled={busy || !text.trim()} style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: busy || !text.trim() ? 0.5 : 1, padding: "10px 16px" }}>
        {busy && <Spinner color={INK} size={12} />}
        {busy ? "Developing..." : "Develop into frames"}
      </button>
      <ErrorNote message={error} onDismiss={() => setError("")} />
    </div>
  );
}

// Idea Detail
function IdeaDetail({ idea, onUpdate, onDelete, onSpawnMore, visions, onClose }) {
  const [draftBusy, setDraftBusy] = useState(false);
  const [editingDraft, setEditingDraft] = useState(idea.draft || "");
  const [elaborateNote, setElaborateNote] = useState("");
  const [elaborateBusy, setElaborateBusy] = useState(false);
  const [error, setError] = useState("");
  const [saved, setSaved] = useState(false);
  const c = CHANNELS[safeChannel(idea.channel)];
  const saveTimeoutRef = useRef(null);

  useEffect(() => {
    setEditingDraft(idea.draft || "");
    setError("");
  }, [idea.id]);

  function patch(fields) {
    onUpdate({ ...idea, ...fields });
    setSaved(true);
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => setSaved(false), 2000);
  }

  async function generateDraft() {
    setDraftBusy(true);
    setError("");
    try {
      const sys = `You write ${c.label} copy for Kali (Queen of the Grain — analogue photographer). Keep it direct, sensory, authentic.`;
      const userMsg = `Idea: ${idea.raw}${idea.title ? `\nTitle: ${idea.title}` : ""}\n\nWrite a ready-to-edit ${c.label} post.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim(), stage: "draft" });
    } catch (e) {
      setError("Draft failed: " + e.message);
    }
    setDraftBusy(false);
  }

  async function elaborate() {
    if (!elaborateNote.trim()) return;
    setElaborateBusy(true);
    setError("");
    try {
      const sys = `You edit social and newsletter content. Keep Kali's voice: direct, sensory, authentic.`;
      const userMsg = `Current draft:\n${editingDraft}\n\nRevision: ${elaborateNote}\n\nReturn full revised draft.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim() });
      setElaborateNote("");
    } catch (e) {
      setError("Edit failed: " + e.message);
    }
    setElaborateBusy(false);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", background: INK, borderLeft: "1px solid rgba(242,237,228,0.12)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "14px 20px", borderBottom: "1px solid rgba(242,237,228,0.12)", flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          {Object.values(CHANNELS).map((ch) => (
            <button key={ch.key} onClick={() => patch({ channel: ch.key })} style={{ padding: "4px 8px", fontSize: 10, fontFamily: MONO, textTransform: "uppercase", letterSpacing: "0.08em", cursor: "pointer", border: `1px solid ${idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.15)"}`, color: idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.4)", background: idea.channel === ch.key ? ch.dim : "transparent" }}>{ch.short}</button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {saved && <SaveIndicator />}
          <button onClick={() => { onDelete(idea.id); onClose(); }} style={{ fontSize: 10, fontFamily: MONO, textTransform: "uppercase", letterSpacing: "0.08em", color: "rgba(242,237,228,0.35)", background: "none", border: "none", cursor: "pointer" }}>delete</button>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 16 }}>
        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>Title</label>
          <input value={idea.title} onChange={(e) => patch({ title: e.target.value })} placeholder="Untitled frame" style={{ width: "100%", background: "transparent", border: "none", borderBottom: "1px solid rgba(242,237,228,0.2)", padding: "4px 0", fontSize: 16, fontFamily: SERIF, color: PAPER, outline: "none", boxSizing: "border-box" }} />
        </div>

        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>The idea, raw</label>
          <textarea value={idea.raw} onChange={(e) => patch({ raw: e.target.value })} rows={3} style={fieldStyle({ color: "rgba(242,237,228,0.85)" })} />
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <button onClick={generateDraft} disabled={draftBusy} style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: draftBusy ? 0.6 : 1 }}>
            {draftBusy && <Spinner color={INK} size={12} />}
            {idea.draft ? "Re-draft" : "Draft this"}
          </button>
        </div>

        {(idea.draft || draftBusy) && (
          <div>
            <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>Draft — edit freely</label>
            {draftBusy && !editingDraft ? (
              <div style={{ ...fieldStyle({ fontFamily: SERIF, fontSize: 14 }), minHeight: 160, display: "flex", alignItems: "center", gap: 8, color: "rgba(242,237,228,0.4)" }}>
                <Spinner color={c.color} size={12} /> developing...
              </div>
            ) : (
              <textarea value={editingDraft} onChange={(e) => { setEditingDraft(e.target.value); patch({ draft: e.target.value }); }} rows={8} style={fieldStyle({ fontFamily: SERIF, fontSize: 14, padding: "12px" })} />
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <input value={elaborateNote} onChange={(e) => setElaborateNote(e.target.value)} onKeyDown={(e) => e.key === "Enter" && !e.shiftKey && elaborate()} placeholder="How to change it..." style={{ flex: 1, minWidth: 160, background: "transparent", border: "1px solid rgba(242,237,228,0.15)", color: PAPER, padding: "8px 10px", fontSize: 12, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }} />
              <button onClick={elaborate} disabled={elaborateBusy || !elaborateNote.trim()} style={{ ...btnBase, border: `1px solid ${c.color}`, color: c.color, background: "transparent", opacity: elaborateBusy || !elaborateNote.trim() ? 0.4 : 1 }}>
                {elaborateBusy ? <Spinner color={c.color} size={12} /> : "Elaborate"}
              </button>
            </div>
          </div>
        )}

        {idea.draft && (
          <button onClick={() => patch({ stage: idea.stage === "ready" ? "draft" : "ready" })} style={{ ...btnBase, border: `1px solid ${idea.stage === "ready" ? "#8a9a7e" : "rgba(242,237,228,0.25)"}`, color: idea.stage === "ready" ? "#8a9a7e" : PAPER, background: "transparent" }}>
            {idea.stage === "ready" ? "✓ Ready to post" : "Mark ready"}
          </button>
        )}

        <ErrorNote message={error} onDismiss={() => setError("")} />
      </div>
    </div>
  );
}

// Main App
function App() {
  const [ideas, setIdeas] = useState([]);
  const [visions, setVisions] = useState({ instagram: "", patreon: "", substack: "" });
  const [filter, setFilter] = useState("all");
  const [activeId, setActiveId] = useState(null);
  const [showVision, setShowVision] = useState(false);
  const [showApi, setShowApi] = useState(false);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const [i, v] = await Promise.all([loadIdeas(), loadVisions()]);
      setIdeas(i);
      setVisions(v);
      setLoaded(true);
    })();
  }, []);

  function nextFrameNo(list) {
    return list.length ? Math.max(...list.map((i) => i.frameNo)) + 1 : 1;
  }

  function addIdeasFromArray(arr) {
    setIdeas((prev) => {
      let n = nextFrameNo(prev);
      const fresh = arr.map((a) => ({
        id: uid(),
        title: a.title || "",
        raw: a.raw || a.title || "",
        channel: safeChannel(a.channel),
        stage: "frame",
        draft: "",
        frameNo: n++,
      }));
      const next = [...fresh, ...prev];
      saveIdeas(next);
      if (fresh.length) setActiveId(fresh[0].id);
      return next;
    });
  }

  function updateIdea(updated) {
    setIdeas((prev) => {
      const next = prev.map((i) => (i.id === updated.id ? updated : i));
      saveIdeas(next);
      return next;
    });
  }

  function deleteIdea(id) {
    setIdeas((prev) => {
      const next = prev.filter((i) => i.id !== id);
      saveIdeas(next);
      return next;
    });
    setActiveId((curr) => (curr === id ? null : curr));
  }

  const filtered = ideas.filter((i) => filter === "all" || i.channel === filter);
  const active = ideas.find((i) => i.id === activeId);

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column", background: INK, color: PAPER, fontFamily: MONO }}>
      {showApi && <ApiKeyModal onClose={() => setShowApi(false)} onSet={() => {}} />}
      {showVision && <VisionRoom visions={visions} setVisions={setVisions} onClose={() => setShowVision(false)} />}

      <header style={{ borderBottom: "1px solid rgba(242,237,228,0.12)", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <h1 style={{ fontFamily: SERIF, fontWeight: 500, fontSize: 24, margin: 0, letterSpacing: "-0.01em" }}>Contact Sheet</h1>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setShowVision(true)} style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}>Vision</button>
          <button onClick={() => setShowApi(true)} style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}>⚙ API</button>
        </div>
      </header>

      <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, borderRight: "1px solid rgba(242,237,228,0.12)" }}>
          <div style={{ padding: 20 }}>
            {loaded && <BrainDump onAdd={addIdeasFromArray} />}
          </div>

          <div style={{ padding: "0 20px 8px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setFilter("all")} style={{ padding: "6px 12px", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", fontFamily: MONO, border: `1px solid ${filter === "all" ? PAPER : "rgba(242,237,228,0.18)"}`, color: filter === "all" ? PAPER : "rgba(242,237,228,0.55)", background: "transparent", cursor: "pointer" }}>ALL · {ideas.length}</button>
            {Object.keys(CHANNELS).map((k) => (
              <ChannelPill key={k} channel={k} active={filter === k} onClick={() => setFilter(k)} />
            ))}
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 20px", display: "flex", gap: 12, flexWrap: "wrap", alignContent: "flex-start" }}>
            {!loaded ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "40px 0", textAlign: "center", color: "rgba(242,237,228,0.4)", width: "100%" }}>loading...</div>
            ) : filtered.length === 0 ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "40px 0", textAlign: "center", color: "rgba(242,237,228,0.35)", width: "100%" }}>No frames yet. Dump a thought above.</div>
            ) : (
              filtered.map((idea) => (
                <IdeaFrame key={idea.id} idea={idea} onOpen={() => setActiveId(idea.id)} isActive={activeId === idea.id} />
              ))
            )}
          </div>
        </div>

        {active && (
          <div style={{ width: 400, display: "flex", flexDirection: "column", minHeight: 0 }}>
            <IdeaDetail idea={active} onUpdate={updateIdea} onDelete={deleteIdea} onSpawnMore={addIdeasFromArray} visions={visions} onClose={() => setActiveId(null)} />
          </div>
        )}
      </div>
    </div>
  );
}

// Render
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
