const STAGE_LABEL = { frame: "Negative", draft: "Proof", ready: "Print" };
const STORAGE_KEY = "studio-ideas-v1";
const VISION_KEY = "studio-visions-v1";
const ACTIVE_KEY = "studio-active-id-v1";

const INK = "#1a1612";
const SERIF = "'Fraunces', Georgia, serif";
const MONO = "'Space Mono', 'Courier New', monospace";

// ---------- Claude API helper with key management ----------
async function callClaude(messages, system, maxTokens = 1200) {
  const apiKey = typeof window !== "undefined" && window.localStorage ? window.localStorage.getItem(API_KEY_KEY) : null;
  if (!apiKey) {
    throw new Error("API key not configured. Click ⚙ Settings to add your Claude API key.");
  }
  
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
    },
    body: JSON.stringify({
      model: "claude-3-5-sonnet-20241022",
      max_tokens: maxTokens,
      system,
      messages,
    }),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    let msg = "API error " + res.status;
    if (res.status === 401) msg = "Invalid API key. Check ⚙ Settings.";
    else if (res.status === 429) msg = "Rate limited. Wait a moment.";
    else if (res.status >= 500) msg = "Anthropic API error. Try again soon.";
    throw new Error(msg);
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  if (!text.trim()) throw new Error("Empty response from model");
  return text;
}

function extractJSON(text) {
  let t = (text || "").trim();
  t = t.replace(/^```json\s*/i, "").replace(/^```\s*/, "").replace(/```\s*$/, "");
  const candidates = [t.indexOf("["), t.indexOf("{")].filter((i) => i >= 0);
  const start = candidates.length ? Math.min(...candidates) : -1;
  const lastArr = t.lastIndexOf("]");
  const lastObj = t.lastIndexOf("}");
  const end = Math.max(lastArr, lastObj);
  if (start >= 0 && end >= 0) t = t.slice(start, end + 1);
  const parsed = JSON.parse(t);
  return Array.isArray(parsed) ? parsed : [parsed];
}

function safeChannel(ch) {
  return CHANNELS[ch] ? ch : "instagram";
}

// ---------- Storage helpers with localStorage ----------
async function loadIdeas() {
  if (typeof localStorage === "undefined") return [];
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    console.error("Failed to load ideas:", e);
    return [];
  }
}

async function saveIdeas(ideas) {
  if (typeof localStorage === "undefined") return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas));
  } catch (e) {
    console.error("Failed to save ideas:", e);
  }
}

async function loadVisions() {
  const fallback = { instagram: "", patreon: "", substack: "" };
  if (typeof localStorage === "undefined") return fallback;
  try {
    const data = localStorage.getItem(VISION_KEY);
    return data ? { ...fallback, ...JSON.parse(data) } : fallback;
  } catch (e) {
    return fallback;
  }
}

async function saveVisions(v) {
  if (typeof localStorage === "undefined") return;
  try {
    localStorage.setItem(VISION_KEY, JSON.stringify(v));
  } catch (e) {
    console.error("Failed to save visions:", e);
  }
}

async function loadActiveId() {
  if (typeof localStorage === "undefined") return null;
  try {
    return localStorage.getItem(ACTIVE_KEY);
  } catch (e) {
    return null;
  }
}

async function saveActiveId(id) {
  if (typeof localStorage === "undefined") return;
  try {
    if (id) localStorage.setItem(ACTIVE_KEY, id);
    else localStorage.removeItem(ACTIVE_KEY);
  } catch (e) {
    console.error("Failed to save active id:", e);
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const btnBase = {

}

// ---------- API Key Settings Modal ----------
function ApiKeyModal({ onClose, onSet }) {
  const [key, setKey] = useState("");
  const [masked, setMasked] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  useEffect(() => {
    if (typeof localStorage !== "undefined") {
      const stored = localStorage.getItem(API_KEY_KEY);
      if (stored) {
        setMasked(stored.slice(0, 10) + "..." + stored.slice(-4));
        setSuccess(true);
      }
    }
  }, []);

  function handleSet() {
    if (!key.trim()) {
      setError("Please enter an API key");
      return;
    }
    if (key.length < 20) {
      setError("API key seems too short");
      return;
    }
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(API_KEY_KEY, key);
      setKey("");
      setMasked(key.slice(0, 10) + "..." + key.slice(-4));
      setError("");
      setSuccess(true);
      onSet();
      setTimeout(() => onClose(), 1000);
    }
  }

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        zIndex: 100,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        background: "rgba(0,0,0,0.8)",
        backdropFilter: "blur(4px)",
        padding: 16,
      }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div
        style={{
          width: "100%",
          maxWidth: 500,
          background: INK,
          border: "1px solid rgba(242,237,228,0.15)",
          padding: 24,
        }}
      >
        <h2 style={{ fontFamily: SERIF, fontSize: 18, color: PAPER, margin: "0 0 12px" }}>
          Claude API Key
        </h2>
        <p style={{ fontFamily: MONO, fontSize: 11, color: "rgba(242,237,228,0.6)", marginBottom: 12, lineHeight: 1.6 }}>
          Get your key from <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener noreferrer" style={{ color: "#ff2d8e", textDecoration: "none" }}>console.anthropic.com/account/keys</a>.
          <br />
          Your key is stored locally only—never sent anywhere else.
        </p>
        {success && (
          <div style={{ background: "rgba(138,154,126,0.1)", border: "1px solid rgba(138,154,126,0.3)", color: "#8a9a7e", fontFamily: MONO, fontSize: 11, padding: "8px 10px", marginBottom: 12, borderRadius: "2px" }}>
            ✓ API key configured: {masked}
          </div>
        )}
        {!success && (
          <input
            type="password"
            value={key}
            onChange={(e) => {
              setKey(e.target.value);
              setError("");
            }}
            onKeyDown={(e) => e.key === "Enter" && handleSet()}
            placeholder="sk-ant-..."
            style={{
              ...fieldStyle({}),
              marginBottom: 12,
              fontFamily: MONO,
              fontSize: 12,
            }}
            autoFocus
          />
        )}
        {error && <ErrorNote message={error} onDismiss={() => setError("")} />}
        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button
            onClick={onClose}
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}
          >
            Close
          </button>
          {!success && (
            <button
              onClick={handleSet}
              style={{ ...btnBase, background: "#ff2d8e", color: INK }}
            >
              Save Key
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- Vision Room ----------
function VisionRoom({ visions, setVisions, onClose }) {
  const [local, setLocal] = useState(visions);
  const [busy, setBusy] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => setLocal(visions), [visions]);

  async function suggestVision(channelKey) {
    setBusy(channelKey);
    setError("");
    const c = CHANNELS[channelKey];
    try {
      const text = await callClaude(
        [
          {
            role: "user",
            content: `Kali is a London analogue photographer & experimental filmmaker (brand: "Queen of the Grain") working with 35mm, darkroom printing, film souping, expired stock. She also runs a creative operations consulting practice. She's ADHD, direct, sensory-focused, no filter. For the ${c.label} channel (${c.desc}), write a concise vision statement: what goes here, tone, audience, what she won't post. 2-3 sentences max. Be specific to her voice and brand.`,
          },
        ],
        "You are a sharp creative strategist who writes vision statements in a direct, specific, slightly literary voice. No marketing fluff. Write for an ADHD creative.",
        400
      );
      const updated = { ...local, [channelKey]: text.trim() };
      setLocal(updated);
      setVisions(updated);
      saveVisions(updated);
    } catch (e) {
      setError("Couldn't generate a suggestion (" + e.message + ")");
    }
    setBusy(null);
  }

  function update(channelKey, val) {
    setLocal((prev) => ({ ...prev, [channelKey]: val }));
  }

  function commit() {
    setVisions(local);
    saveVisions(local);
    onClose();
  }

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        zIndex: 50,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        background: "rgba(0,0,0,0.7)",
        backdropFilter: "blur(4px)",
        padding: 16,
      }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div
        style={{
          width: "100%",
          maxWidth: 640,
          maxHeight: "92vh",
          overflowY: "auto",
          background: INK,
          border: "1px solid rgba(242,237,228,0.15)",
        }}
      >
        <div
          style={{
            position: "sticky",
            top: 0,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,
            padding: "16px 20px",
            borderBottom: "1px solid rgba(242,237,228,0.12)",
            background: INK,
          }}
        >
          <div>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(242,237,228,0.4)" }}>
              Light Table
            </div>
            <h2 style={{ fontFamily: SERIF, fontSize: 20, color: PAPER, margin: "2px 0 0" }}>Vision &amp; tone, per channel</h2>
          </div>
          <button
            onClick={commit}
            style={{ ...btnBase, background: "#ff2d8e", color: INK, flexShrink: 0 }}
          >
            Done
          </button>
        </div>

        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 20 }}>
          {Object.values(CHANNELS).map((c) => (
            <div key={c.key} style={{ border: "1px solid rgba(242,237,228,0.12)" }}>
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  gap: 8,
                  padding: "10px 16px",
                  background: c.dim,
                  flexWrap: "wrap",
                }}
              >
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: MONO, fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: c.color }}>
                    {c.label}
                  </span>
                  <span style={{ fontSize: 11, color: "rgba(242,237,228,0.45)", fontFamily: MONO }}>{c.desc}</span>
                </div>
                <button
                  onClick={() => suggestVision(c.key)}
                  disabled={busy === c.key}
                  style={{
                    ...btnBase,
                    fontSize: 10,
                    padding: "5px 10px",
                    border: `1px solid ${c.color}`,
                    color: c.color,
                    background: "transparent",
                    opacity: busy === c.key ? 0.6 : 1,
                  }}
                >
                  {busy === c.key ? <Spinner color={c.color} size={11} /> : null}
                  {busy === c.key ? "writing" : "suggest"}
                </button>
              </div>
              <textarea
                value={local[c.key] || ""}
                onChange={(e) => update(c.key, e.target.value)}
                placeholder={`What is ${c.label} for? Tone, pace, what you won't post here...`}
                rows={4}
                style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: "12px 16px" })}
              />
            </div>
          ))}
          <ErrorNote message={error} onDismiss={() => setError("")} />
        </div>
      </div>
    </div>
  );
}

// ---------- Detail panel ----------
function IdeaDetail({ idea, onUpdate, onDelete, onSpawnMore, visions, onClose }) {
  const [draftBusy, setDraftBusy] = useState(false);
  const [trendBusy, setTrendBusy] = useState(false);
  const [moreBusy, setMoreBusy] = useState(false);
  const [editingDraft, setEditingDraft] = useState(idea.draft || "");
  const [elaborateNote, setElaborateNote] = useState("");
  const [elaborateBusy, setElaborateBusy] = useState(false);
  const [error, setError] = useState("");
  const [saved, setSaved] = useState(false);
  const c = CHANNELS[safeChannel(idea.channel)];
  const saveTimeoutRef = useRef(null);

  useEffect(() => {
    setEditingDraft(idea.draft || "");
    setError("");
  }, [idea.id]);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        generateDraft();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        patch({ stage: idea.stage === "ready" ? "draft" : "ready" });
      }
      if (e.key === "Escape") {
        e.preventDefault();
        onClose();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [idea, onClose]);

  function patch(fields) {
    onUpdate({ ...idea, ...fields });
    setSaved(true);
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => setSaved(false), 2000);
  }

  async function generateDraft() {
    setDraftBusy(true);
    setError("");
    try {
      const sys = `You write Instagram captions, Patreon posts, and Substack newsletter copy for Kali, a London analogue photographer and experimental filmmaker (brand "Queen of the Grain") working with 35mm, darkroom printing, film souping, expired stock. She also runs creative operations consulting. She's ADHD, direct, sensory-focused, no filter or creator-speak. Keep her voice: specific, slightly irreverent, grounded. Output only the ready-to-edit post draft, no meta-commentary.`;
      const visionNote = visions[idea.channel] ? `\n\nChannel vision/tone: ${visions[idea.channel]}` : "";
      const userMsg = `Channel: ${c.label} (${c.desc})${visionNote}\n\nIdea: ${idea.raw}${idea.title ? `\nWorking title: ${idea.title}` : ""}\n\nWrite a ready-to-edit ${c.label} post draft. Keep it direct and specific. ${c.label === "Instagram" ? "Under 300 chars if possible. No hashtags unless essential." : c.label === "Patreon" ? "Behind-the-scenes, personal, intimate. 200-400 words." : "Conversational, considered, longer-form. 500-800 words."}`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim(), stage: "draft" });
    } catch (e) {
      setError("Draft failed: " + e.message);
    }
    setDraftBusy(false);
  }

  async function elaborate() {
    if (!elaborateNote.trim()) return;
    setElaborateBusy(true);
    setError("");
    try {
      const sys = `You write/edit social and newsletter content for Kali (Queen of the Grain — analogue photography, darkroom, film souping). Keep her voice: direct, sensory, no creator-speak. Output just the revised draft, nothing else.`;
      const userMsg = `Channel: ${c.label}\n\nCurrent draft:\n${editingDraft}\n\nRevision request: ${elaborateNote}\n\nReturn the full revised draft.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 900);
      setEditingDraft(text.trim());
      patch({ draft: text.trim() });
      setElaborateNote("");
    } catch (e) {
      setError("Edit failed: " + e.message);
    }
    setElaborateBusy(false);
  }

  async function checkTrends() {
    setTrendBusy(true);
    setError("");
    try {
      const sys = `You are a content strategist for independent artists in niche communities. Give brief, concrete, tactical notes on current demand/format trends relevant to the given idea and channel. No generic advice. Focus on what's actually working right now for analogue/experimental makers.`;
      const userMsg = `Channel: ${c.label}\nIdea: ${idea.raw}\n\nWhat's currently working in this space (formats, hooks, angles) that this idea could borrow from? Give 3-4 tactical bullets.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 500);
      patch({ trendNotes: text.trim() });
    } catch (e) {
      setError("Couldn't fetch notes: " + e.message);
    }
    setTrendBusy(false);
  }

  async function spawnMore() {
    setMoreBusy(true);
    setError("");
    try {
      const sys = `You generate content ideas for Kali, a London analogue photographer/filmmaker (Queen of the Grain: 35mm, darkroom, film souping, expired stock, creative-ops consulting). Generate follow-on ideas that are adjacent but distinct from a seed idea. Output JSON: [{"channel":"instagram|patreon|substack","raw":"idea text","title":"optional short title"}]`;
      const userMsg = `Seed idea (on ${c.label}): "${idea.raw}"${idea.draft ? `\n\nDraft that came from it:\n${idea.draft}` : ""}\n\nGive me 3 adjacent or follow-on content ideas — different enough to feel fresh, but thematically connected. Vary the channels if it makes sense. Return as JSON array only.`;
      const text = await callClaude([{ role: "user", content: userMsg }], sys, 700);
      const arr = extractJSON(text);
      if (!arr.length) throw new Error("model returned no ideas");
      onSpawnMore(arr);
    } catch (e) {
      setError("Couldn't generate follow-ons: " + e.message);
    }
    setMoreBusy(false);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 8,
          padding: "14px 20px",
          borderBottom: "1px solid rgba(242,237,228,0.12)",
          flexWrap: "wrap",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          {Object.values(CHANNELS).map((ch) => (
            <button
              key={ch.key}
              onClick={() => patch({ channel: ch.key })}
              style={{
                padding: "4px 8px",
                fontSize: 10,
                fontFamily: MONO,
                textTransform: "uppercase",
                letterSpacing: "0.08em",
                cursor: "pointer",
                border: `1px solid ${idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.15)"}`,
                color: idea.channel === ch.key ? ch.color : "rgba(242,237,228,0.4)",
                background: idea.channel === ch.key ? ch.dim : "transparent",
              }}
            >
              {ch.short}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {saved && <SaveIndicator />}
          <button
            onClick={() => onDelete(idea.id)}
            style={{
              fontSize: 10,
              fontFamily: MONO,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
              color: "rgba(242,237,228,0.35)",
              background: "none",
              border: "none",
              cursor: "pointer",
            }}
          >
            delete
          </button>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 20 }}>
        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
            Title
          </label>
          <input
            value={idea.title}
            onChange={(e) => patch({ title: e.target.value })}
            placeholder="Untitled frame"
            style={{
              width: "100%",
              background: "transparent",
              border: "none",
              borderBottom: "1px solid rgba(242,237,228,0.2)",
              padding: "4px 0",
              fontSize: 16,
              fontFamily: SERIF,
              color: PAPER,
              outline: "none",
              boxSizing: "border-box",
            }}
          />
        </div>

        <div>
          <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
            The idea, raw
          </label>
          <textarea
            value={idea.raw}
            onChange={(e) => patch({ raw: e.target.value })}
            rows={3}
            style={fieldStyle({ color: "rgba(242,237,228,0.85)" })}
          />
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <button
            onClick={generateDraft}
            disabled={draftBusy}
            title="Cmd/Ctrl+K"
            style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: draftBusy ? 0.6 : 1 }}
          >
            {draftBusy && <Spinner color={INK} size={12} />}
            {idea.draft ? "Re-draft" : "Draft this"}
          </button>
          <button
            onClick={checkTrends}
            disabled={trendBusy}
            title="What's trending"
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent", opacity: trendBusy ? 0.6 : 1 }}
          >
            {trendBusy && <Spinner color={PAPER} size={12} />}
            What's working now
          </button>
        </div>

        <ErrorNote message={error} onDismiss={() => setError("")} />

        {idea.trendNotes && (
          <div
            style={{
              borderLeft: `2px solid ${c.color}`,
              paddingLeft: 12,
              fontSize: 12,
              lineHeight: 1.6,
              whiteSpace: "pre-line",
              color: "rgba(242,237,228,0.7)",
            }}
          >
            {idea.trendNotes}
          </div>
        )}

        {(idea.draft || draftBusy) && (
          <div>
            <label style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", display: "block", marginBottom: 6, color: "rgba(242,237,228,0.4)" }}>
              Draft — edit freely
            </label>
            {draftBusy && !editingDraft ? (
              <div
                style={{
                  ...fieldStyle({ fontFamily: SERIF, fontSize: 14 }),
                  minHeight: 160,
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  color: "rgba(242,237,228,0.4)",
                }}
              >
                <Spinner color={c.color} size={12} /> developing print...
              </div>
            ) : (
              <textarea
                value={editingDraft}
                onChange={(e) => {
                  setEditingDraft(e.target.value);
                  patch({ draft: e.target.value });
                }}
                rows={10}
                style={fieldStyle({ fontFamily: SERIF, fontSize: 14, padding: "12px" })}
              />
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <input
                value={elaborateNote}
                onChange={(e) => setElaborateNote(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && !e.shiftKey && elaborate()}
                placeholder="Tell Claude how to change it — shorter, warmer, add a CTA..."
                style={{
                  flex: 1,
                  minWidth: 160,
                  background: "transparent",
                  border: "1px solid rgba(242,237,228,0.15)",
                  color: PAPER,
                  padding: "8px 10px",
                  fontSize: 12,
                  outline: "none",
                  boxSizing: "border-box",
                  fontFamily: "inherit",
                }}
              />
              <button
                onClick={elaborate}
                disabled={elaborateBusy || !elaborateNote.trim()}
                title="Cmd/Ctrl+Enter"
                style={{
                  ...btnBase,
                  border: `1px solid ${c.color}`,
                  color: c.color,
                  background: "transparent",
                  opacity: elaborateBusy || !elaborateNote.trim() ? 0.4 : 1,
                }}
              >
                {elaborateBusy ? <Spinner color={c.color} size={12} /> : "Elaborate"}
              </button>
            </div>
          </div>
        )}

        {idea.draft && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, paddingTop: 8, flexWrap: "wrap" }}>
            <button
              onClick={() => patch({ stage: idea.stage === "ready" ? "draft" : "ready" })}
              title="Cmd/Ctrl+S"
              style={{
                ...btnBase,
                border: `1px solid ${idea.stage === "ready" ? "#8a9a7e" : "rgba(242,237,228,0.25)"}`,
                color: idea.stage === "ready" ? "#8a9a7e" : PAPER,
                background: "transparent",
              }}
            >
              {idea.stage === "ready" ? "✓ Marked ready to post" : "Mark ready to post"}
            </button>
            <button
              onClick={spawnMore}
              disabled={moreBusy}
              style={{
                ...btnBase,
                border: `1px solid ${c.color}`,
                color: c.color,
                background: "transparent",
                opacity: moreBusy ? 0.6 : 1,
              }}
            >
              {moreBusy && <Spinner color={c.color} size={12} />}
              + 3 more like this
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Brain Dump ----------
function BrainDump({ onAdd, inputRef }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === "d") {
        e.preventDefault();
        inputRef.current?.focus();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement === inputRef.current) {
        e.preventDefault();
        process();
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [text, inputRef]);

  async function process() {
    if (!text.trim()) return;
    setBusy(true);
    setError("");
    try {
      const sys = `You take messy, rapid-fire brain-dump text from Kali, an ADHD creative (analogue photographer/filmmaker, "Queen of the Grain" — 35mm, darkroom, film souping, expired stock; also runs creative-ops consulting). You split tangled, half-formed ideas into clean separate ideas. You infer channels (instagram, patreon, substack) based on content type and energy. Output as JSON array: [{"channel":"instagram|patreon|substack","raw":"idea in Kali's voice","title":"optional short title"}]. Be specific.`;
      const out = await callClaude([{ role: "user", content: text }], sys, 800);
      const arr = extractJSON(out);
      if (!arr.length) throw new Error("couldn't find any ideas in that — try rephrasing");
      onAdd(arr);
      setText("");
    } catch (e) {
      setError("Couldn't process that: " + e.message);
    }
    setBusy(false);
  }

  return (
    <div style={{ border: "1px solid rgba(255,45,142,0.3)", background: "rgba(255,45,142,0.04)", padding: 16 }}>
      <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 8, color: "#ff2d8e" }}>
        Brain dump → frames
      </div>
      <textarea
        ref={inputRef}
        value={text}
        onChange={(e) => setText(e.target.value)}
        placeholder="Dump everything. Half-thoughts, three ideas tangled together, a feeling about a roll of film you just developed — whatever's loud right now. Claude will split it into separate frames."
        rows={4}
        style={fieldStyle({ border: "none", fontFamily: SERIF, fontSize: 14, padding: 0, marginBottom: 12 })}
      />
      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <button
          onClick={process}
          disabled={busy || !text.trim()}
          style={{ ...btnBase, background: "#ff2d8e", color: INK, opacity: busy || !text.trim() ? 0.5 : 1, padding: "10px 16px" }}
        >
          {busy && <Spinner color={INK} size={12} />}
          {busy ? "Developing..." : "Develop into frames"}
        </button>
        <span style={{ fontFamily: MONO, fontSize: 9, color: "rgba(242,237,228,0.3)" }}>or Cmd/Ctrl+Enter</span>
      </div>
      <ErrorNote message={error} onDismiss={() => setError("")} />
    </div>
  );
}

// ---------- Main App ----------
function App() {
  const [ideas, setIdeas] = useState([]);
  const [visions, setVisions] = useState({ instagram: "", patreon: "", substack: "" });
  const [filter, setFilter] = useState("all");
  const [activeId, setActiveId] = useState(null);
  const [showVision, setShowVision] = useState(false);
  const [showShortcuts, setShowShortcuts] = useState(false);
  const [showApiModal, setShowApiModal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [isNarrow, setIsNarrow] = useState(typeof window !== "undefined" ? window.innerWidth < 1024 : false);
  const brainDumpRef = useRef(null);

  useEffect(() => {
    (async () => {
      const [i, v, activeId] = await Promise.all([loadIdeas(), loadVisions(), loadActiveId()]);
      setIdeas(i);
      setVisions(v);
      if (activeId && i.find(x => x.id === activeId)) {
        setActiveId(activeId);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    saveActiveId(activeId);
  }, [activeId]);

  useEffect(() => {
    function onResize() {
      setIsNarrow(window.innerWidth < 1024);
    }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === "Escape" && (showVision || showShortcuts || showApiModal)) {
        setShowVision(false);
        setShowShortcuts(false);
        setShowApiModal(false);
      }
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === "?") {
        e.preventDefault();
        setShowShortcuts(true);
      }
      // Quick filter by number key
      if (e.key === "1") setFilter("all");
      if (e.key === "2") setFilter("instagram");
      if (e.key === "3") setFilter("patreon");
      if (e.key === "4") setFilter("substack");
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [showVision, showShortcuts, showApiModal]);

  function nextFrameNo(list) {
    return list.length ? Math.max(...list.map((i) => i.frameNo)) + 1 : 1;
  }

  function addIdeasFromArray(arr) {
    setIdeas((prev) => {
      let n = nextFrameNo(prev);
      const fresh = arr.map((a) => ({
        id: uid(),
        title: a.title || "",
        raw: a.raw || a.title || "",
        channel: safeChannel(a.channel),
        stage: "frame",
        draft: "",
        trendNotes: "",
        frameNo: n++,
        createdAt: Date.now(),
      }));
      const next = [...fresh, ...prev];
      saveIdeas(next);
      if (fresh.length) setActiveId(fresh[0].id);
      return next;
    });
  }

  function updateIdea(updated) {
    setIdeas((prev) => {
      const next = prev.map((i) => (i.id === updated.id ? updated : i));
      saveIdeas(next);
      return next;
    });
  }

  function deleteIdea(id) {
    setIdeas((prev) => {
      const next = prev.filter((i) => i.id !== id);
      saveIdeas(next);
      return next;
    });
    setActiveId((curr) => (curr === id ? null : curr));
  }

  const filtered = ideas.filter((i) => filter === "all" || i.channel === filter);
  const active = ideas.find((i) => i.id === activeId);

  const counts = ideas.reduce((acc, i) => {
    const k = safeChannel(i.channel);
    acc[k] = (acc[k] || 0) + 1;
    return acc;
  }, {});

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column", background: INK, color: PAPER, fontFamily: MONO }}>
      <header
        style={{
          borderBottom: "1px solid rgba(242,237,228,0.12)",
          padding: "16px 20px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          gap: 12,
          flexWrap: "wrap",
        }}
      >
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
          <h1 style={{ fontFamily: SERIF, fontWeight: 500, fontSize: 24, margin: 0, letterSpacing: "-0.01em" }}>
            Contact Sheet
          </h1>
          <span style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(242,237,228,0.4)" }}>
            content studio
          </span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <button
            onClick={() => setShowVision(true)}
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent" }}
          >
            Vision &amp; tone
          </button>
          <button
            onClick={() => setShowShortcuts(true)}
            title="Cmd/Ctrl+Shift+?"
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent", fontSize: 10 }}
          >
            ? Help
          </button>
          <button
            onClick={() => setShowApiModal(true)}
            style={{ ...btnBase, border: "1px solid rgba(242,237,228,0.25)", color: PAPER, background: "transparent", fontSize: 10 }}
          >
            ⚙ API Key
          </button>
        </div>
      </header>

      <div style={{ flex: 1, display: "flex", flexDirection: isNarrow ? "column" : "row", minHeight: 0 }}>
        <div
          style={{
            flex: 1,
            display: "flex",
            flexDirection: "column",
            minHeight: 0,
            borderRight: isNarrow ? "none" : "1px solid rgba(242,237,228,0.12)",
            borderBottom: isNarrow ? "1px solid rgba(242,237,228,0.12)" : "none",
          }}
        >
          <div style={{ padding: 20 }}>
            <BrainDump onAdd={addIdeasFromArray} inputRef={brainDumpRef} />
          </div>

          <div style={{ padding: "0 20px 8px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <button
              onClick={() => setFilter("all")}
              title="Press 1"
              style={{
                padding: "6px 12px",
                fontSize: 11,
                letterSpacing: "0.12em",
                textTransform: "uppercase",
                fontFamily: MONO,
                border: `1px solid ${filter === "all" ? PAPER : "rgba(242,237,228,0.18)"}`,
                color: filter === "all" ? PAPER : "rgba(242,237,228,0.55)",
                background: "transparent",
                cursor: "pointer",
              }}
            >
              ALL · {ideas.length}
            </button>
            {Object.keys(CHANNELS).map((k) => (
              <ChannelPill key={k} channel={k} active={filter === k} onClick={() => setFilter(k)} />
            ))}
            <span style={{ fontFamily: MONO, fontSize: 10, color: "rgba(242,237,228,0.35)", marginLeft: "auto" }}>
              {Object.entries(counts)
                .map(([k, v]) => `${CHANNELS[k].short} ${v}`)
                .join("  ·  ")}
            </span>
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: "0 20px 20px" }}>
            {!loaded ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "40px 0", textAlign: "center", color: "rgba(242,237,228,0.4)" }}>
                loading sheet...
              </div>
            ) : filtered.length === 0 ? (
              <div style={{ fontFamily: MONO, fontSize: 12, padding: "64px 0", textAlign: "center", lineHeight: 1.6, color: "rgba(242,237,228,0.35)" }}>
                No frames yet.
                <br />
                Dump a thought above — it'll show up here.
              </div>
            ) : (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignContent: "flex-start" }}>
                {filtered.map((idea) => (
                  <IdeaFrame
                    key={idea.id}
                    idea={idea}
                    onOpen={() => setActiveId(idea.id)}
                    isActive={activeId === idea.id}
                  />
                ))}
              </div>
            )}
          </div>
        </div>

        {!isNarrow && active && (
          <div
            className="slide-in-panel"
            style={{
              width: 400,
              borderLeft: "1px solid rgba(242,237,228,0.12)",
              display: "flex",
              flexDirection: "column",
              background: INK,
              overflow: "hidden",
            }}
          >
            <IdeaDetail
              idea={active}
              onUpdate={updateIdea}
              onDelete={deleteIdea}
              onSpawnMore={addIdeasFromArray}
              visions={visions}
              onClose={() => setActiveId(null)}
            />
          </div>
        )}

        {isNarrow && active && (
          <div
            className="slide-in-panel"
            style={{
              position: "fixed",
              inset: 0,
              zIndex: 40,
              display: "flex",
              background: INK,
              flexDirection: "column",
            }}
          >
            <IdeaDetail
              idea={active}
              onUpdate={updateIdea}
              onDelete={deleteIdea}
              onSpawnMore={addIdeasFromArray}
              visions={visions}
              onClose={() => setActiveId(null)}
            />
          </div>
        )}
      </div>

      {showVision && <VisionRoom visions={visions} setVisions={setVisions} onClose={() => setShowVision(false)} />}
      {showShortcuts && <ShortcutsHelp onClose={() => setShowShortcuts(false)} />}
      {showApiModal && <ApiKeyModal onClose={() => setShowApiModal(false)} onSet={() => {}} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
